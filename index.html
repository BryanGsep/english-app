<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd3e5">
<title>ESP Trainer — Tiếng Anh chuyên ngành Thủy văn & Thiên tai</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Học từ vựng tiếng Anh chuyên ngành kỹ thuật tài nguyên nước và giảm nhẹ thiên tai, rút từ 50 bài báo thật.">
</head>
<body>
  <main id="view" class="view"></main>
  <div id="toast" class="toast"></div>

  <!-- Thu tu nap la BAT BUOC — xem CLAUDE.md muc 2 -->
  <script src="data/vocab.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/srs.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/celebrate.js"></script>
  <script src="assets/js/games/registry.js"></script>
  <script src="assets/js/games/flash.js"></script>
  <script src="assets/js/games/quiz.js"></script>
  <script src="assets/js/games/listen.js"></script>
  <script src="assets/js/games/scramble.js"></script>
  <script src="assets/js/games/cloze.js"></script>
  <script src="assets/js/games/match.js"></script>
  <script src="assets/js/games/speed.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    /* Mot file khong nap duoc — mang chap chon dung luc cap nhat, hay cache cua
       service worker giu ban hong — lam app chet LANG LE: cac man hinh khac van
       chay, rieng cho nao dung toi file thieu thi trong tron. Da gap that: thieu
       art.js thi man "Ket qua" chi con moi cai tieu de.
       Kiem ngay luc khoi dong, hong thi noi ro va cho nguoi hoc sua bang mot nut. */
    (function () {
      var CAN = ['VOCAB', 'Store', 'SRS', 'Data', 'UI', 'Art', 'Celebrate', 'Games', 'App'];
      var thieu = [];
      for (var i = 0; i < CAN.length; i++) if (!window[CAN[i]]) thieu.push(CAN[i]);

      if (!thieu.length) {
        window.App.start();
      } else {
        baoHong(thieu);
      }

      function baoHong(thieu) {
        var v = document.getElementById('view');
        while (v.firstChild) v.removeChild(v.firstChild);
        v.style.cssText = 'max-width:420px;margin:0 auto;padding:24px 18px;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#3d2130';
        add('h1', 'Bản cập nhật tải thiếu file', 'font-size:20px;margin:0 0 12px');
        add('p', 'App vẫn mở được nhưng một vài màn hình sẽ trống, ví dụ màn Kết quả. ' +
                 'Chạm nút bên dưới để tải lại bản đầy đủ.', 'margin:0 0 8px');
        add('p', 'Tiến độ học của bạn KHÔNG bị xoá — nút này chỉ dọn bản lưu tạm của trang.',
            'margin:0 0 18px;color:#8a6076;font-size:13.5px');
        var nut = document.createElement('button');
        nut.textContent = 'Tải lại bản mới';
        nut.style.cssText = 'width:100%;min-height:48px;border:0;border-radius:14px;' +
          'background:#d8246f;color:#fff;font:600 16px/1 inherit;cursor:pointer';
        nut.onclick = function () { nut.disabled = true; nut.textContent = 'Đang tải lại…'; donDep(); };
        v.appendChild(nut);
        add('p', 'Thiếu: ' + thieu.join(', '), 'margin:18px 0 0;color:#a98;font-size:12px');

        function add(tag, chu, css) {
          var n = document.createElement(tag);
          n.textContent = chu;
          n.style.cssText = css;
          v.appendChild(n);
          return n;
        }
      }

      /* Xoa cache cua service worker roi go dang ky, sau do tai lai tu mang.
         KHONG dung toi localStorage — tien do hoc nam o do (CLAUDE.md muc 1.4). */
      function donDep() {
        var xong = function () { location.reload(); };
        var buoc = Promise.resolve();
        try {
          if (window.caches && caches.keys) {
            buoc = buoc.then(function () { return caches.keys(); }).then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            });
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            buoc = buoc.then(function () { return navigator.serviceWorker.getRegistrations(); })
              .then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              });
          }
          buoc.then(xong, xong);
        } catch (e) { xong(); }
        setTimeout(xong, 4000);   // luoi an toan: khong doi mai
      }
    })();

    // Service worker chi song tren http(s); mo bang file:// van chay binh thuong.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
