<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff3f8}
iframe{width:360px;height:1500px;border:0;display:block;margin:0}
</style></head><body>
<iframe id="f"></iframe>
<script>
var f=document.getElementById('f');
var q=decodeURIComponent(location.search.slice(1)||'#/');
f.src='../index.html'+q;
f.addEventListener('load',function(){
  setTimeout(function(){
    var d=f.contentDocument;
    f.style.height=Math.min(1500,Math.max(700,d.body.scrollHeight+20))+'px';
  },400);
});
</script></body></html>
