<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f3d9e5}
iframe{width:360px;height:1400px;border:0;display:block;margin:0 auto;background:#fff3f8}
</style></head><body>
<iframe id="f" src="../index.html"></iframe>
<pre id="RESULT" style="color:#0f0;font:12px monospace;white-space:pre-wrap"></pre>
<script>
var f=document.getElementById('f'), out=[];
f.addEventListener('load', function(){
  var w=f.contentWindow, d=f.contentDocument;
  var target=(location.hash||'#/').replace('#F','');
  function probe(hash){
    w.location.hash=hash; w.dispatchEvent(new w.HashChangeEvent('hashchange'));
    var vw=d.documentElement.clientWidth;
    out.push('=== '+hash+' vw='+vw+' scrollW='+d.documentElement.scrollWidth);
    var bad=[];
    d.querySelectorAll('#view *').forEach(function(n){
      var r=n.getBoundingClientRect();
      if(r.right>vw+0.5||r.left<-0.5) bad.push((n.className||n.tagName)+'@'+Math.round(r.right));
    });
    if(bad.length) out.push('   TRAN: '+Array.from(new Set(bad)).slice(0,10).join(' | '));
  }
  ['#/','#/deck/hydro','#/play/all/quiz','#/play/all/match','#/play/all/scramble','#/play/all/cloze','#/play/all/speed','#/list/all','#/list/all/mastered','#/list/all/due','#/stats','#/settings'].forEach(probe);
  document.getElementById('RESULT').textContent=out.join('\n');
});
</script></body></html>
